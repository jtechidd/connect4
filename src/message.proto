syntax = "proto3";

package C4;

enum MessageType {
  Command = 0;
  Event   = 1;
}

message EventClientDataUpdated {
  uint32      client_id       = 1;
  ClientState state           = 2;
  uint32      current_game_id = 3;
  string      username        = 4;
}

message EventUsernameCheckFailed {}

enum GameState {
  GAME_STATE_WAITING = 0;
  GAME_STATE_IN_GAME = 1;
  GAME_STATE_VERDICT = 2;
}

enum GamePlayer {
  GAME_PLAYER_EMPTY = 0;
  GAME_PLAYER_1     = 1;
  GAME_PLAYER_2     = 2;
}

enum GameVerdict {
  GAME_VERDICT_UNDECIDED   = 0;
  GAME_VERDICT_PLAYER1_WIN = 1;
  GAME_VERDICT_PLAYER2_WIN = 2;
  GAME_VERDICT_TIE         = 3;
}

message GameInfo {
  uint32    id         = 1;
  uint32    player1_id = 2;
  uint32    player2_id = 3;
  GameState state      = 4;
}

enum ClientState {
  CLIENT_STATE_USERNAME = 0;
  CLIENT_STATE_LOBBY    = 1;
  CLIENT_STATE_IN_GAME  = 2;
}

message ClientInfo {
  uint32      id       = 1;
  string      username = 2;
  ClientState state    = 3;
}

message EventLobbyUpdated {
  uint32              total_clients = 1;
  repeated ClientInfo clients       = 2;
  uint32              total_games   = 3;
  repeated GameInfo   games         = 4;
}

message EventNewGameInviteReceived {
  uint32 inviter_client_id = 1;
  string inviter_username  = 2;
}

message EventGameUpdated {
  uint32              game_id            = 1;
  uint32              player1_id         = 2;
  uint32              player2_id         = 3;
  uint32              opponent_client_id = 4;
  string              opponent_username  = 5;
  uint32              round              = 6;
  GameState           state              = 7;
  GamePlayer          turn               = 8;
  GameVerdict         verdict            = 9;
  repeated GamePlayer board              = 10;
  repeated uint32     connect_mask       = 11;
}

message EventGameCreated {
  uint32 game_id    = 1;
  uint32 player1_id = 2;
}

message EventPlayerJoined {
  uint32 game_id    = 1;
  uint32 player2_id = 2;
}

message EventGameStarted { uint32 game_id = 1; }

message EventPlayerMadeMove {
  uint32 game_id       = 1;
  uint32 player_id     = 2;
  uint32 played_column = 3;
}

message EventGameVerdicted {
  uint32 game_id      = 1;
  uint32 game_verdict = 2;
}

message EventPlayerLeft {
  uint32 game_id   = 1;
  uint32 player_id = 2;
}

message EventPayload {
  oneof payload {
    EventClientDataUpdated     event_client_data_updated      = 1;
    EventUsernameCheckFailed   event_username_check_failed    = 2;
    EventLobbyUpdated          event_lobby_updated            = 3;
    EventNewGameInviteReceived event_new_game_invite_received = 4;
    EventGameUpdated           event_game_updated             = 5;
  }
}

message CommandEnterLobby {
  string username = 1;
}

message CommandNewGameInvite {
  uint32 client_id = 1;
}

message CommandInviteAccept {
  uint32 inviter_client_id = 1;
}

message CommandJoinGame {
  uint32 game_id = 1;
}

message CommandStartGame {
  uint32 game_id = 1;
}

message CommandPlayerMakeMove {
  uint32 game_id       = 1;
  uint32 player_id     = 2;
  uint32 played_column = 3;
}

message CommandPlayerQuitGame {
  uint32 game_id   = 1;
  uint32 player_id = 2;
}

message CommandPayload {
  oneof payload {
    CommandEnterLobby     command_enter_lobby      = 1;
    CommandNewGameInvite  command_new_game_invite  = 2;
    CommandInviteAccept   command_invite_accept    = 3;
    CommandPlayerMakeMove command_player_make_move = 4;
    CommandPlayerQuitGame command_player_quit_game = 5;
  }
}

message Message {
  uint32 id = 1;
  oneof payload_type {
    EventPayload   event_payload   = 2;
    CommandPayload command_payload = 3;
  }
}